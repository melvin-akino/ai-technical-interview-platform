server {
    listen 80;
    server_name localhost;

    # Default 1m is too small for PDF resume uploads (batch endpoint accepts up to 5 files).
    client_max_body_size 20m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket Proxy — MUST come before `location /api`.
    # The WS routes are registered on the interviews router, which is mounted at
    # /api/v1/interviews, so their real paths are /api/v1/interviews/ws/{id} (chat) and
    # /api/v1/interviews/ws/{id}/voice. Those match the `/api` prefix block below, which
    # does NOT forward the Upgrade handshake — nginx would then downgrade the request to a
    # plain HTTP GET and FastAPI's HTTP router returns 404 (websocket-only path).
    # A regex location takes precedence over a prefix location, so this claims them first.
    location ~ ^/api/v1/interviews/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API Proxy
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy /ws prefix (no route currently serves it; kept harmless for compatibility)
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
